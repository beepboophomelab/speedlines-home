<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>speedlines.uk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='24' height='3' rx='1.5' fill='%23c0392b'/%3E%3Crect x='8' y='15' width='20' height='3' rx='1.5' fill='%23c0392b'/%3E%3Crect x='12' y='21' width='16' height='3' rx='1.5' fill='%23c0392b'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f3efe6; --ink: #1d1c1a; --soft: #6b665d; --line: #c0392b; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --ink: #ede8de; --soft: #9a9488; --line: #e05a47; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", Avenir, "Futura", "Century Gothic", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; width: 100%; }
  .lines { display: grid; gap: 9px; margin-bottom: 2.4rem; }
  .lines span { display: block; height: 7px; border-radius: 4px; background: var(--line); }
  .lines span:nth-child(1) { width: 100%; }
  .lines span:nth-child(2) { width: 78%; }
  .lines span:nth-child(3) { width: 56%; }
  .hi { color: var(--soft); letter-spacing: .14em; text-transform: uppercase; font-size: .85rem; margin: 0 0 .6rem; }
  h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; margin: 0 0 1.2rem; font-weight: 700; letter-spacing: -.01em; }
  p { font-size: 1.1rem; line-height: 1.6; margin: 0 0 1rem; }
  .aside { color: var(--soft); }
  footer { margin-top: 2.8rem; padding-top: 1rem; border-top: 1px solid color-mix(in srgb, var(--soft) 35%, transparent);
           color: var(--soft); font-size: .85rem; letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <div class="lines" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="hi">Ey up</p>
  <h1>Nowt to see ’ere, duck.</h1>
  <p>This is just the plumbing behind a few home-made gadgets. No shop, no sign-ups, no cookies. Not even an oatcake.</p>
  <p class="aside">If tha’s lost, t’ rest o’ t’ internet is that way. Mind how you go.</p>
  <footer>Made in Sheffield · stainless since 1913</footer>
</main>
</body>
</html>
